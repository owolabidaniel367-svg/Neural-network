<!DOCTYPE html>
<html>
<head>

<title>28x28 Draw</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  canvas { border: 1px solid #000; image-rendering: pixelated; touch-action: none; cursor: crosshair; }

  <canvas id="canvas" width="560" height="560"></canvas>

</body>
</html>
